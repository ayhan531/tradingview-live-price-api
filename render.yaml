services:
  - type: web
    name: tradingview-price-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: UPDATE_INTERVAL_SECONDS
        value: "10"
